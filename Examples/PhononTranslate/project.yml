name: PhononTranslate

options:
  minimumXcodeGenVersion: 2.45.0
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"

configs:
  Debug: debug
  Release: release

packages:
  mlx-audio-swift:
    path: ../..
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    # mlx-swift 0.33 support is not yet available in a tagged release.
    revision: 128f49f1db38ea7b949f2ebb60967def8b76f58e
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface.git
    exactVersion: 0.8.1
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    exactVersion: 1.1.9

targets:
  PhononTranslate:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: PhononTranslate
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: mlx-audio-swift
        product: MLXAudioCore
      - package: mlx-audio-swift
        product: MLXAudioTTS
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_NAME: PhononTranslate
        SWIFT_VERSION: 6.2
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Phonon Translate
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

  PhononTranslateTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources: [Tests]
    dependencies:
      - target: PhononTranslate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PhononTranslateTests
        SWIFT_VERSION: 6.2
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/PhononTranslate.app/Contents/MacOS/PhononTranslate"

schemes:
  PhononTranslate:
    build:
      targets:
        PhononTranslate: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [PhononTranslateTests]
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
